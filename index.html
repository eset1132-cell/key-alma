
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bekleme Sayfası</title>

<style>
body {
  background: #202124;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 50px 15px;
}

button {
  padding: 15px 35px;
  border: none;
  border-radius: 10px;
  font-size: 18px;
  cursor: pointer;
}

#devam {
  background: #8ab4f8;
}

button:disabled {
  background: #777;
  cursor: not-allowed;
}
</style>
</head>

<body>

<h2>Bekleme Sayfası</h2>

<p id="sayac">Kalan süre: 90 saniye</p>

<button id="devam" disabled onclick="git()">
Devam Et
</button>

<script>
let kalan = 90;

const sayac = document.getElementById("sayac");
const buton = document.getElementById("devam");

const zamanlayici = setInterval(() => {
  kalan--;

  sayac.textContent = "Kalan süre: " + kalan + " saniye";

  if (kalan <= 0) {
    clearInterval(zamanlayici);
    sayac.textContent = "Süre tamamlandı!";
    buton.disabled = false;
  }
}, 1000);

function git() {
  window.location.href = "https://eset1132-cell.github.io/Oras-/";
}
</script>

</body>
</html>
